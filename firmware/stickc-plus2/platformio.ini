[platformio]
default_envs = stickc-plus2-usb

[env:stickc-plus2-usb]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/shared_ui.py
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    lvgl/lvgl@7.11.0
    bblanchon/ArduinoJson@7.4.3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
