[platformio]
default_envs = stickc-plus2-usb
extra_configs = ../../.gar/composition/board.ini

[env:stickc-plus2-usb]
extends = board
extra_scripts = pre:scripts/shared_ui.py
lib_deps =
    ${board.lib_deps}
    lvgl/lvgl@7.11.0
    bblanchon/ArduinoJson@7.4.3
build_flags =
    ${board.build_flags}
    -std=gnu++17
